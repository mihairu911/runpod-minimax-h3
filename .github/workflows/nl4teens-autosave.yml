name: N&L autosave image

on:
  push:
    branches: [nl4teens-autosave]
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: nl4teens-autosave-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m py_compile handler.py
      - name: Autosave regression tests
        run: python -m unittest discover -s tests -p 'test_nl4teens_autosave.py' -v

  build:
    if: "github.event_name != 'pull_request' && github.event.head_commit.message != 'ci: probe GHCR public access'"
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:autosave-test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            nl4teens.autosave.version=direct-handler-v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  public_pull_probe:
    if: "github.event_name == 'push' && github.event.head_commit.message == 'ci: probe GHCR public access'"
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check anonymous GHCR manifest pull
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error, urllib.parse
          image = os.environ["GITHUB_REPOSITORY"].lower()
          scope = urllib.parse.quote("repository:" + image + ":pull")
          url = "https://ghcr.io/token?service=ghcr.io&scope=" + scope
          try:
              with urllib.request.urlopen(url, timeout=20) as reply:
                  token = json.load(reply)["token"]
              request = urllib.request.Request(
                  "https://ghcr.io/v2/" + image + "/manifests/autosave-test",
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as reply:
                  print("Anonymous image pull verified:", reply.status)
                  print("Digest:", reply.headers.get("Docker-Content-Digest", "not supplied"))
          except urllib.error.HTTPError as error:
              print("GHCR anonymous pull rejected:", error.code)
              raise SystemExit(1)
          PY
