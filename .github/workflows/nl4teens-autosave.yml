name: N&L autosave image

on:
  push:
    branches: [nl4teens-autosave]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m py_compile handler.py
      - name: Autosave regression tests
        run: python -m unittest discover -s tests -p 'test_nl4teens_autosave.py' -v

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:autosave-test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            nl4teens.autosave.version=direct-handler-v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
